<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOONER PROCESSING UNIT ($GPU)</title>
<meta name="description" content="GPU = Gooner Processing Unit. 400 hours uptime. 99°C. Has not touched grass.">
<meta name="theme-color" content="#0b0210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='7' width='30' height='18' rx='4' fill='%236e6e74' stroke='%238cff2e' stroke-width='1.5'/%3E%3Ccircle cx='10' cy='15' r='5.5' fill='%23fff' stroke='%230b0710' stroke-width='1.5'/%3E%3Ccircle cx='22' cy='15' r='5.5' fill='%23fff' stroke='%230b0710' stroke-width='1.5'/%3E%3Ccircle cx='10' cy='15' r='2' fill='%230b0710'/%3E%3Ccircle cx='22' cy='15' r='2' fill='%230b0710'/%3E%3C/svg%3E">
<style>:root{
  --g:#8cff2e; --lime:#c4ff2e; --mag:#ff2bd6; --cyan:#2ee8ff; --ink:#eef2fb; --dim:rgba(238,242,251,.55);
  --bg0:#07060b; --pcb:#0d1410; --pcb2:#13201a; --gold:#d9b25a;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Unbounded","Arial Black",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:clip}
html,body{margin:0;height:100%;background:#0b0210;color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}

/* gate */
.gate{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;transition:opacity .7s ease}
.gate.out{opacity:0;pointer-events:none}
.glass{position:relative;width:min(300px,78vw);padding:34px 26px 26px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 30px 80px rgba(0,0,0,.8),-24px 0 70px rgba(140,255,46,.14),24px 0 70px rgba(255,43,214,.14);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:breathe 3.4s ease-in-out infinite}
.glass::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(140,255,46,.7) 30%,rgba(255,255,255,.8) 50%,rgba(255,43,214,.7) 70%,transparent)}
.glass::after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.08),transparent 38%);pointer-events:none}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 30px 80px rgba(0,0,0,.8),-30px 0 100px rgba(140,255,46,.26),30px 0 100px rgba(255,43,214,.26)}}
.install{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:58px;border-radius:16px;border:1px solid rgba(140,255,46,.45);
  background:radial-gradient(120% 140% at 30% 0%,rgba(140,255,46,.2),transparent 60%),radial-gradient(120% 140% at 80% 100%,rgba(255,43,214,.18),transparent 60%),rgba(255,255,255,.02);
  color:#eafff0;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.32em;padding-left:.32em;cursor:pointer;
  text-shadow:0 0 14px rgba(140,255,46,.7);transition:transform .15s,border-color .2s,box-shadow .2s}
.install:hover{border-color:var(--g);box-shadow:0 0 24px rgba(140,255,46,.25),0 0 40px rgba(255,43,214,.15)}
.install:active{transform:scale(.98)}
.install:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.install svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(140,255,46,.9))}
.ews{position:relative;z-index:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.42em;color:rgba(238,242,251,.5);padding-left:.42em}

/* film */
.hud{position:fixed;left:clamp(16px,3vw,40px);top:clamp(16px,4vh,40px);z-index:10;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--g);text-shadow:0 0 10px rgba(140,255,46,.7);line-height:1.9;pointer-events:none;min-width:220px}
.hud div{display:flex;gap:14px}
.hud b{font-weight:500;width:84px;color:rgba(238,242,251,.6);text-shadow:none}
.hud span.hot{color:#ff3b3b;text-shadow:0 0 12px rgba(255,40,40,.9)}
.hud .warn{margin-top:6px;color:#ff3b3b;font-weight:700;text-shadow:0 0 12px rgba(255,40,40,.9);border:1px solid rgba(255,59,59,.6);padding:2px 8px;border-radius:4px;display:inline-flex}
.skip{position:fixed;right:clamp(16px,3vw,32px);bottom:max(18px,env(safe-area-inset-bottom));z-index:12;height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(238,242,251,.25);background:rgba(10,8,16,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink);cursor:pointer;opacity:.75;transition:opacity .2s}
.skip:hover{opacity:1}

/* home */
.home-ui{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s ease}
.home-ui.in{opacity:1}
.brand{position:absolute;left:clamp(16px,3vw,36px);top:clamp(16px,3vh,28px);display:flex;flex-direction:column;gap:7px;max-width:calc(100vw - 170px)}
.b-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-name{font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--ink);text-shadow:0 0 18px rgba(140,255,46,.25)}
.b-tick{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:4px 7px;border-radius:6px;background:linear-gradient(90deg,var(--g),var(--lime));color:#06120a}
.b-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim)}
.snd{position:absolute;right:clamp(16px,3vw,36px);top:clamp(14px,3vh,26px);pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:999px;border:1px solid rgba(238,242,251,.22);background:rgba(10,8,16,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink);cursor:pointer}
.snd i{width:7px;height:7px;border-radius:50%;background:#555}
.snd[aria-pressed=true] i{background:var(--g);box-shadow:0 0 8px var(--g)}
.hint{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:rgba(238,242,251,.42);padding:0 16px}
.throttle{position:absolute;left:50%;top:clamp(70px,13vh,120px);transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.2em;color:#ff3b3b;border:1px solid rgba(255,59,59,.7);background:rgba(40,0,0,.55);padding:8px 14px;border-radius:6px;text-shadow:0 0 12px rgba(255,40,40,.9);animation:blink .32s steps(2) infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.25}}

.bubble{position:fixed;left:0;top:0;z-index:20;background:#fff;color:#0b0710;font-weight:900;font-size:15px;padding:10px 16px;border-radius:18px;border:4px solid #0b0710;box-shadow:5px 5px 0 #0b0710,0 0 30px rgba(140,255,46,.35);white-space:nowrap;pointer-events:none;margin-top:-14px;transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-15px;margin-left:-9px;width:16px;height:16px;background:#fff;border-right:4px solid #0b0710;border-bottom:4px solid #0b0710;transform:rotate(45deg) skew(8deg,8deg)}
.toast{position:fixed;left:50%;top:clamp(70px,11vh,96px);transform:translateX(-50%);z-index:30;padding:9px 16px;border-radius:999px;background:var(--g);color:#0b0710;border:3px solid #0b0710;box-shadow:4px 4px 0 #0b0710;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}

.readout{position:absolute;left:clamp(16px,3vw,36px);bottom:max(20px,env(safe-area-inset-bottom));font-family:var(--mono);font-size:10px;letter-spacing:.14em;line-height:1.9;color:var(--g);text-shadow:0 0 10px rgba(140,255,46,.5)}
.readout div{display:flex;gap:12px}
.readout b{font-weight:500;width:74px;color:rgba(238,242,251,.45);text-shadow:none}
.readout .hot{color:#ff4b4b;text-shadow:0 0 10px rgba(255,40,40,.7)}

/* gallery: cartoon GDDR memory modules */
.gallery{position:fixed;inset:0;z-index:40;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:radial-gradient(60% 45% at 15% 0%,rgba(140,255,46,.12),transparent 70%),radial-gradient(60% 50% at 90% 10%,rgba(255,43,214,.2),transparent 70%),linear-gradient(180deg,#1a0620,#0b0210);
  opacity:0;transition:opacity .35s ease}
.gallery.in{opacity:1}
.g-inner{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,3vw,40px) 60px}
.g-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(22px,3vw,38px);flex-wrap:wrap}
.g-k{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.24em;color:var(--g)}
.g-head h2{margin:8px 0 0;font-weight:900;font-size:clamp(38px,6.5vw,78px);line-height:.95;letter-spacing:-.01em;color:#fff;-webkit-text-stroke:3px #0b0710;paint-order:stroke fill;text-shadow:5px 5px 0 #0b0710,0 0 34px rgba(140,255,46,.45)}
.g-head h2 em{font-style:normal;color:var(--mag)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:clamp(16px,2.4vw,30px)}
.vram{position:relative;border-radius:16px;padding:12px 12px 14px;background:#6e6e74;border:4px solid #0b0710;
  box-shadow:6px 6px 0 #0b0710,0 0 0 2px rgba(140,255,46,.0);transform:rotate(var(--r,0deg));transition:transform .18s,box-shadow .18s}
.vram:hover{transform:rotate(0deg) translateY(-4px) scale(1.02);box-shadow:8px 10px 0 #0b0710,0 0 34px rgba(140,255,46,.45)}
.vram header{display:flex;justify-content:space-between;padding:0 2px 8px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:#0b0710}
.vram header span:last-child{background:var(--g);border:2px solid #0b0710;border-radius:6px;padding:1px 6px}
.chip-row{display:flex;gap:7px;padding:0 2px 10px}
.chip-row i{flex:1;height:12px;border-radius:3px;background:#2b2b31;border:2px solid #0b0710}
.screen{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#1a0620;border:4px solid #0b0710}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.slot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;
  background:radial-gradient(circle at 50% 45%,rgba(255,43,214,.25),transparent 65%),repeating-linear-gradient(45deg,rgba(140,255,46,.06) 0 10px,transparent 10px 20px)}
.slot b{font-size:22px;letter-spacing:.02em;color:#fff;-webkit-text-stroke:2px #0b0710;paint-order:stroke fill}
.slot span{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--g)}
.vram footer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px 0}
.pads{display:block;flex:1;max-width:120px;height:14px;background:repeating-linear-gradient(90deg,#ffc928 0 8px,#0b0710 8px 10px,transparent 10px 12px);border:2px solid #0b0710;border-radius:2px;background-color:#2a8f3c}
.dl{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#0b0710;background:var(--g);padding:7px 10px;border-radius:8px;border:3px solid #0b0710;box-shadow:3px 3px 0 #0b0710;text-decoration:none;white-space:nowrap}
.dl.off{opacity:.45;background:#bdb7c4}
.pcb-btn{position:relative;height:48px;padding:0 22px;border-radius:12px;border:4px solid #0b0710;background:var(--g);color:#0b0710;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;cursor:pointer;
  box-shadow:5px 5px 0 #0b0710;transition:transform .12s,box-shadow .12s}
.pcb-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 #0b0710,0 0 26px rgba(140,255,46,.5)}
.pcb-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #0b0710}

@media (max-width:700px){
  .b-name{font-size:12px}
  .b-meta{font-size:8px;letter-spacing:.12em}
  .hud{font-size:10.5px;min-width:0}
  .hud b{width:70px}
  .g-grid{grid-template-columns:1fr 1fr;gap:10px}
  .vram{padding:8px 8px 10px}
  .vram header{font-size:8px;padding:0 2px 6px}
  .vram header span:last-child{display:none}
  .chip-row{padding:0 2px 7px;gap:4px}
  .chip-row i{height:7px}
  .slot b{font-size:14px}
  .slot span{font-size:8px}
  .pads{max-width:40px}
  .dl{font-size:9px;padding:6px 7px}
  .hint{font-size:9px;letter-spacing:.1em}
  .throttle{font-size:11px}
  .readout{left:0;right:0;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 34px);display:flex;flex-direction:column;align-items:center;font-size:11px}
  .readout div{width:230px}
  .readout b{width:96px}
}
</style>
<script src="./config.js"></script>
</head>
<body>
<canvas id="gl" aria-label="Gooner Processing Unit graphics card"></canvas>

<div id="gate" class="gate">
  <div class="glass">
    <button id="install" class="install" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8" /><path d="M6.3 6.8a8 8 0 1 0 11.4 0" /></svg>
      <span>INSTALL</span>
    </button>
    <div class="ews">ENTER WITH SOUND</div>
  </div>
</div>

<div id="hud" class="hud" aria-hidden="true"></div>
<button id="skip" class="skip" type="button" hidden>Skip intro ›</button>

<div id="homeUI" class="home-ui" hidden>
  <div class="brand">
    <div class="b-row"><span class="b-name">GOONER PROCESSING UNIT</span><span class="b-tick">$GPU</span></div>
    <div class="b-meta">SOLANA · PUMP.FUN</div>
  </div>
  <button id="soundBtn" class="snd" type="button" aria-pressed="true"><i></i><span>SOUND ON</span></button>
  <div class="readout" aria-hidden="true">
    <div><b>GPU TEMP</b><span class="hot">99°C</span></div>
    <div><b>UPTIME</b><span id="uptime">400:00:00</span></div>
    <div><b>GRASS</b><span>NOT TOUCHED</span></div>
  </div>
  <div id="hint" class="hint">drag to tilt · click him · double-click the card</div>
  <div id="throttle" class="throttle" hidden>⚠ THERMAL THROTTLING</div>
</div>

<div id="bubble" class="bubble" hidden></div>
<div id="toast" class="toast" hidden></div>

<section id="gallery" class="gallery" hidden aria-label="Meme VRAM">
  <div class="g-inner">
    <header class="g-head">
      <div>
        <div class="g-k">GPU · VRAM BANK 0 · GDDR-MEME</div>
        <h2>MEME <em>VRAM</em></h2>
      </div>
      <button id="backToCard" class="pcb-btn" type="button">← BACK TO CARD</button>
    </header>
    <div id="memeGrid" class="g-grid"></div>
  </div>
